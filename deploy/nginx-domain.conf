# ═══════════════════════════════════════════════════════════
#  FleetDesk — nginx конфиг с доменом
#  Скопировать в /etc/nginx/sites-available/fleetdesk
#  после привязки домена и получения SSL сертификата
#
#  Замените YOUR_DOMAIN на ваш реальный домен
# ═══════════════════════════════════════════════════════════

# Редирект HTTP → HTTPS
server {
    listen 80;
    server_name api.YOUR_DOMAIN;
    return 301 https://$host$request_uri;
}

# Основной HTTPS блок для бот-менеджера
server {
    listen 443 ssl http2;
    server_name api.YOUR_DOMAIN;

    # SSL (certbot заполняет эти поля автоматически)
    ssl_certificate     /etc/letsencrypt/live/api.YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.YOUR_DOMAIN/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # Логи
    access_log /var/log/nginx/fleetdesk.access.log;
    error_log  /var/log/nginx/fleetdesk.error.log;

    # Проксирование на бот-менеджер
    location / {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Таймауты (Telegram long-polling может быть долгим)
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # CORS для CRM
        add_header 'Access-Control-Allow-Origin'  'https://crm.YOUR_DOMAIN' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, X-Notify-Secret' always;

        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin'  'https://crm.YOUR_DOMAIN';
            add_header 'Access-Control-Max-Age'       3600;
            add_header 'Content-Type'                 'text/plain; charset=utf-8';
            add_header 'Content-Length'               0;
            return 204;
        }
    }
}
